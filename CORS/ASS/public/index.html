<!DOCTYPE html>
<html lang="en" xmlns:input="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>CORS</title>
</head>
<body>
    <input type="text" placeholder="Enter 1st text" id="a">
    <input type="text" placeholder="Enter 2nd text" id="b">
    <button id="btn" onclick="sendRequest()">Find Sum</button>
    <p>using npx serve to host the public folder in http server</p>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        async function sendRequest() {
            const response = await axios.post("http://localhost:3000/sum", {
                a: document.getElementById("a").value,
                b: document.getElementById("b").value,
            })
            console.log(response.data);
        }
    </script>
</body>
</html>
